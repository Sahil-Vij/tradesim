name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tradesim
          POSTGRES_PASSWORD: tradesim
          POSTGRES_DB: tradesim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradesim"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tradesim:tradesim@localhost:5432/tradesim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run build
